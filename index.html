<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inland Farms Delivery</title>
    <style>
      #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: black;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 1s ease;
      }
      #splash iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      #root { display: none; }
    </style>
  </head>
  <body>
    <div id="splash">
      <iframe
        src="https://www.youtube.com/embed/41nsLrkCn70?autoplay=1&mute=1&controls=0&loop=0&rel=0&showinfo=0"
        allow="autoplay"
      ></iframe>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(() => {
        const splash = document.getElementById('splash');
        const root = document.getElementById('root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
          root.style.display = 'block';
        }, 1000);
      }, 16000);
    </script>
  </body>
</html>
