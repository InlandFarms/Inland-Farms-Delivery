<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inland Farms Delivery</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: black;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 1.5s ease;
      }
      #splash video {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        min-width: 100%;
        min-height: 100%;
        object-fit: cover;
      }
      #root { display: none; }
    </style>
  </head>
  <body>
    <div id="splash">
      <video autoplay muted playsinline>
        <source src="https://res.cloudinary.com/iwoi7ut5/video/upload/Inland-Splash_Screen.mp4" type="video/mp4" />
      </video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(() => {
        const splash = document.getElementById('splash');
        const root = document.getElementById('root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
          root.style.display = 'block';
        }, 1500);
      }, 15000);
    </script>
  </body>
</html>
